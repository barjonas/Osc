name: Build

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:

  Build_And_Package:
    name: Build and package
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      SLN_PATH: .\src\GameshowPro.Osc.slnx
      PUBLISH_PATH: .\publish

    outputs:
      semver2_version: ${{ env.NBGV_SemVer2 }}
      nuget_version: ${{ env.NBGV_NuGetPackageVersion }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

    # global.json pins a .NET 11 release candidate; the action installs a prerelease global.json version as written.
    - name: Use .NET 11 (global.json)
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Nerdbank.GitVersioning
      uses: dotnet/nbgv@v0.5.2
      with:
        setAllVars: true

    - name: Run tests
      run: dotnet test $env:SLN_PATH -c Release

    - name: Build packages
      run: dotnet pack $env:SLN_PATH --output $env:PUBLISH_PATH -c Release

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: |
          ${{ env.PUBLISH_PATH }}/*.nupkg
          ${{ env.PUBLISH_PATH }}/*.snupkg
        if-no-files-found: error
        retention-days: 3

  Release_And_Push:
    name: Release and push packages
    needs: Build_And_Package
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.Build_And_Package.outputs.semver2_version }}

    steps:
    # Needed for global.json, so the dotnet CLI resolves the pinned SDK.
    - uses: actions/checkout@v7

    - name: Use .NET 11 (global.json)
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./all-packages

    # Creates the v<version> tag on the built commit along with the release.
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ env.VERSION }}
        target_commitish: ${{ github.sha }}
        files: |
          ./all-packages/**/*.nupkg
          ./all-packages/**/*.snupkg

    - name: Publish NuGet packages
      run: |
        $packages = Get-ChildItem -Path "./all-packages" -Recurse -Filter "*.nupkg"
        foreach ($package in $packages) {
          Write-Host "Pushing package: $($package.FullName)"
          dotnet nuget push $package.FullName --api-key "${{ secrets.GSP_PACKAGE_PAT }}" --source "${{ vars.NUGET_URL }}" --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to push package: $($package.Name)"
            exit 1
          }
        }
